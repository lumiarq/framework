name: Release Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  release-matrix:
    name: Release Readiness Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No source-level JS drift
        run: bash scripts/check-source-js-drift.sh

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Anti-coupling tests
        run: pnpm --filter @illumiarq/core test

      - name: Lint
        run: pnpm turbo lint

      - name: Test with coverage
        run: pnpm turbo test:coverage

      - name: Build
        run: pnpm turbo build
